# Development stack: PHP-FPM + nginx for the API, Vite for the SPA.
# SQLite lives in a named volume so the database survives container restarts.
name: expenses-manager-dev

services:
  php:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      target: dev
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - sqlite-data:/var/www/html/database/sqlite
    environment:
      APP_ENV: local
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/sqlite/database.sqlite
    healthcheck:
      test: ["CMD", "pgrep", "php-fpm"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
      target: dev
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}/api/v1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  sqlite-data:
  web-node-modules:
