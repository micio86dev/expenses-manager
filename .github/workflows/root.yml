# Runs on every push and pull request to main and develop, and on demand (workflow_dispatch).
name: root

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  contract-drift:
    name: OpenAPI contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Check contract copies match the source of truth
        run: make contract-check

  docker-build:
    name: Build production images
    runs-on: ubuntu-latest
    needs: contract-drift
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build backend prod image
        run: docker build --target prod -f backend/docker/Dockerfile -t expenses-backend:ci backend
      - name: Build frontend prod image
        run: docker build --target prod -f frontend/docker/Dockerfile -t expenses-frontend:ci frontend

  scripts-and-docs:
    name: Shell scripts and README references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install shfmt 3.14.1 (the version the scripts are formatted with)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shfmt" https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          echo "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  $RUNNER_TEMP/shfmt" | sha256sum --check
          sudo install "$RUNNER_TEMP/shfmt" /usr/local/bin/shfmt
          shfmt --version
      - name: shellcheck
        run: shellcheck start.sh scripts/*.sh .githooks/*
      - name: shfmt
        run: shfmt -d start.sh scripts/*.sh
      - name: start.sh behaviour tests
        run: scripts/test-scripts.sh
      - name: README references exist
        run: scripts/check-readme.sh

  # Guardian Angel review of the last commit. Skipped, with a notice, until ANTHROPIC_API_KEY is set.
  gga:
    name: Guardian Angel review
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Skip without an API key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY is not set, so the Guardian Angel review is skipped."
      - name: Install Guardian Angel and the Claude Code CLI (the configured provider)
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.296
          git clone https://github.com/Gentleman-Programming/gentleman-guardian-angel.git "$RUNNER_TEMP/gga"
          git -C "$RUNNER_TEMP/gga" checkout --quiet fbf1091da170a33d42cb97577a9813e652e98a4a
          echo "$RUNNER_TEMP/gga/bin" >> "$GITHUB_PATH"
      - name: Review the last commit
        if: env.ANTHROPIC_API_KEY != ''
        run: gga run --ci
